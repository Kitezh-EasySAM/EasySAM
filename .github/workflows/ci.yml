# Проверка на каждый push и pull request: то же, что `make check` локально.
# e2e (make e2e) — локально: им нужна выгрузка с ПК в материалы/, в репозитории её нет.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Rust stable + цель Windows
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Зависимости
        run: |
          npm ci --no-audit --no-fund
          (cd web && npm ci --no-audit --no-fund)

      - name: make check
        run: make check
