# Запуск: docker compose up -d --build   → интерфейс http://localhost:8000 (вход admin / admin или ADMIN_PASSWORD; при первом входе — смена пароля)
# Пароль первого admin:  docker compose logs sam | grep Создан
# Чистая БД (только реальные данные): docker compose down -v && docker compose up -d
# Добавить демо-данные:  docker compose exec sam node src/scripts/run-demo.ts   (после загрузки выгрузки с ПК через интерфейс)
# Переменные берутся из .env рядом (тот же, что для make dev); PORT и DB_PATH внутри контейнера свои.
services:
  sam:
    build:
      context: .
      args:
        AGENT: ${AGENT:-1} # 0 — не собирать sam-agent.exe (сборка быстрее)
    image: sam:latest
    ports:
      - "${SAM_PORT:-8000}:8000" # агенты на ВМ ходят на 192.168.249.1:8000
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-} # общий токен агентов (только отладка); пусто = выключен, агенты — по ключу регистрации
      REQUIRE_DEVICE_TOKEN: ${REQUIRE_DEVICE_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-} # токен для скриптов; пусто = выключен
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-} # пароль admin при первом старте (пусто — «admin»); при первом входе система попросит сменить
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUBLIC_URL: ${PUBLIC_URL:-} # адрес для агентов в sam-agent.json (http://192.168.249.1:8000); пусто — адрес из браузера
      SEED: ${SEED:-1} # пустой том → стартовый каталог
      DEMO: ${DEMO:-0} # 1 — при первом старте ещё и демо (закупки, сотрудники, лицензии ПК, КриптоПро)
      STALE_DAYS: ${STALE_DAYS:-90}
      # ИИ: localhost/127.0.0.1 в адресе модели контейнер сам заменит на host.docker.internal (LM Studio на этом ноутбуке).
      # LM Studio должен слушать не только 127.0.0.1: Developer → Settings → «Serve on Local Network».
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      EULA_FETCH: ${EULA_FETCH:-on}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sam-data:/data
    restart: unless-stopped

volumes:
  sam-data:
